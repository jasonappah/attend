buildscript {
    ext {
        buildToolsVersion = "37.0.0"
        minSdkVersion = 26
        compileSdkVersion = 37
        targetSdkVersion = 36
        ndkVersion = "27.1.12297006"
        kotlinVersion = "2.2.0"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")
        // https://rnrepo.org — prebuilt AARs for supported native deps
        def rnrepoDir = new File(
            providers.exec {
                workingDir(rootDir)
                commandLine("node", "--print", "require.resolve('@rnrepo/build-tools/package.json')")
            }.standardOutput.asText.get().trim()
        ).getParentFile().absolutePath
        classpath fileTree(dir: "${rnrepoDir}/gradle-plugin/build/libs", include: ["prebuilds-plugin.jar"])
    }
}

apply plugin: "com.facebook.react.rootproject"
