apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"
apply plugin: "org.rnrepo.tools.prebuilds-plugin"

// Canonical state and variant validation are shared with vite.config.ts.
def releaseConfig = new groovy.json.JsonSlurper().parseText(providers.exec {
    workingDir(rootDir.parentFile)
    commandLine("bun", "scripts/release/native.ts")
}.standardOutput.asText.get().trim())

/**
 * This is the configuration block to customize your React Native Android app.
 * By default you don't need to apply any configuration, just uncomment the lines you need.
 */
def resolveNodePackage = { packageName ->
    providers.exec {
        workingDir(rootDir)
        commandLine("node", "--print", "require.resolve('" + packageName + "')")
    }.standardOutput.asText.get().trim()
}

def resolveReactNativeDependency = { packageName ->
    providers.exec {
        workingDir(rootDir)
        commandLine("node", "--print", "require('module').createRequire(require.resolve('react-native/package.json')).resolve('" + packageName + "')")
    }.standardOutput.asText.get().trim()
}

react {
    // [vxrn/one] the bundle command should find the entry file automatically,
    // we are setting this to a file that will definitely exist to avoid
    // 'detectEntryFile' (defined in react-native-gradle-plugin/src/main/kotlin/com/facebook/react/utils/PathUtils.kt)
    // to use a non-existing 'index.js' file as default and make the Android
    // build fail with Gradle error:
    // 'An input file was expected to be present but it doesn't exist.'
    entryFile = file("../../package.json")

    /* Folders */
    //   The root of your project, i.e. where "package.json" lives. Default is '../..'
    // root = file("../../")
    // [vxrn/one] resolve hoisted packages from the generated project instead of assuming
    // the application has its own node_modules directory.
    reactNativeDir = file(resolveNodePackage("react-native/package.json")).parentFile
    codegenDir = file(resolveReactNativeDependency("@react-native/codegen/package.json")).parentFile
    // [vxrn/one] vxrn owns the cli even when the app has no hoisted cli package
    cliFile = file(providers.exec {
        workingDir(rootDir)
        commandLine("node", "--print", "require('module').createRequire(require.resolve('vxrn/package.json')).resolve('@react-native-community/cli/build/bin.js')")
    }.standardOutput.asText.get().trim())
    // [vxrn/one] resolve hermesc from the same react-native installation
    hermesCommand = new File(file(resolveReactNativeDependency("hermes-compiler/package.json")).parentFile, "hermesc/%OS-BIN%/hermesc").absolutePath

    /* Variants */
    //   The list of variants to that are debuggable. For those we're going to
    //   skip the bundling of the JS bundle and the assets. By default is just 'debug'.
    //   If you add flavors like lite, prod, etc. you'll have to list your debuggableVariants.
    // debuggableVariants = ["liteDebug", "prodDebug"]

    /* Bundling */
    //   A list containing the node command and its flags. Default is just 'node'.
    // nodeExecutableAndArgs = ["node"]
    //
    //   The command to run when bundling. By default is 'bundle'
    // bundleCommand = "ram-bundle"
    //
    //   The path to the CLI configuration file. Default is empty.
    // bundleConfig = file(../rn-cli.config.js)
    //
    //   The name of the generated asset file containing your JS bundle
    // bundleAssetName = "MyApplication.android.bundle"
    //
    //   The entry file for bundle generation. Default is 'index.android.js' or 'index.js'
    // entryFile = file("../js/MyApplication.android.js")
    //
    //   A list of extra flags to pass to the 'bundle' commands.
    //   See https://github.com/react-native-community/cli/blob/main/docs/commands.md#bundle
    // extraPackagerArgs = []

    /* Hermes Commands */
    //   The hermes compiler command to run. By default it is 'hermesc'
    // hermesCommand = "$rootDir/my-custom-hermesc/bin/hermesc"
    //
    //   The list of flags to pass to the Hermes compiler. By default is "-O", "-output-source-map"
    // hermesFlags = ["-O", "-output-source-map"]

    /* Autolinking */
    autolinkLibrariesWithApp()
}

// Matches installed vxrn's embedded update integration, without prebuild.
tasks.matching { it.name.startsWith("createBundle") && it.name.endsWith("JsAndAssets") }.configureEach { bundleTask ->
    def bundleDir = bundleTask.jsBundleDir
    def embeddedRuntime = releaseConfig.runtimeVersion
    def embeddedMetadata = [variant: releaseConfig.variant]
    inputs.file(rootProject.file("../release.json"))
    inputs.property("appVariant", releaseConfig.variant)
    inputs.property("updatesUrl", releaseConfig.updatesUrl)
    // A cached bundle must not keep a previous checkout's compiled identity.
    inputs.property("softwareVersion", releaseConfig.softwareVersion)
    inputs.property("gitSha", releaseConfig.gitSha)
    bundleTask.doLast {
        def manifestFile = new File(bundleDir.get().asFile, "one-updates-embedded.json")
        manifestFile.text = groovy.json.JsonOutput.toJson([
            id: java.util.UUID.randomUUID().toString(),
            createdAt: java.time.Instant.now().toString(),
            runtimeVersion: embeddedRuntime,
            metadata: embeddedMetadata,
        ])
    }
}

/**
 * Set this to true to Run Proguard on Release builds to minify the Java bytecode.
 */
def enableProguardInReleaseBuilds = false

/**
 * The preferred build flavor of JavaScriptCore (JSC)
 *
 * For example, to use the international variant, you can use:
 * `def jscFlavor = io.github.react-native-community:jsc-android-intl:2026004.+`
 *
 * The international variant includes ICU i18n library and necessary data
 * allowing to use e.g. `Date.toLocaleString` and `String.localeCompare` that
 * give correct results when using with locales other than en-US. Note that
 * this variant is about 6MiB larger per architecture than default.
 */
def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "me.jasonaa.attend"
    defaultConfig {
        applicationId releaseConfig.bundleId
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode releaseConfig.build
        versionName releaseConfig.version
        resValue "string", "app_name", releaseConfig.displayName
        // Quotes prevent aapt interpreting a numeric runtime as an integer.
        resValue "string", "one_updates_runtime_version", '"' + releaseConfig.runtimeVersion + '"'
        manifestPlaceholders.oneUpdatesUrl = releaseConfig.updatesUrl
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        release {
            // CI signs with a keystore provided via secrets; local dev falls back to debug.
            def releaseStoreFile = System.env.ANDROID_RELEASE_STORE_FILE
            def releaseStorePassword = System.env.ANDROID_RELEASE_STORE_PASSWORD
            def releaseKeyAlias = System.env.ANDROID_RELEASE_KEY_ALIAS
            def releaseKeyPassword = System.env.ANDROID_RELEASE_KEY_PASSWORD
            storeFile = releaseStoreFile ? file(releaseStoreFile) : file('debug.keystore')
            storePassword = releaseStorePassword ?: 'android'
            keyAlias = releaseKeyAlias ?: 'androiddebugkey'
            keyPassword = releaseKeyPassword ?: 'android'
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            signingConfig signingConfigs.release
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }
}

dependencies {
    // The version of react-native is set by the React Native Gradle Plugin
    implementation("com.facebook.react:react-android")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}

/**
 * [vxrn/one] ensure patches are applied
 * uses ExecOperations injection (Gradle 9 compatible)
 */
interface InjectedExecOps {
    @Inject
    ExecOperations getExecOps()
}

def injected = objects.newInstance(InjectedExecOps)

// capture rootDir as a String at configuration time so the doFirst
// closure below does not reference a Gradle script object at execution
// time, which is unsupported with --configuration-cache
def rootDirString = rootDir.toString()

gradle.taskGraph.whenReady { taskGraph ->
    tasks.named("createBundleReleaseJsAndAssets").configure {
        doFirst {
            def vxrnCli = new File(["node", "--print", "require.resolve('vxrn/package.json')"].execute(null, new File(rootDirString)).text.trim()).getParentFile().getAbsolutePath() + "/run.mjs"
            injected.execOps.exec {
                commandLine "node", vxrnCli, "patch"
            }
        }
    }
}
