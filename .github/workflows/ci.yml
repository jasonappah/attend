name: attend checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.16.0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run typecheck
      - run: bunx biome ci . --reporter=github
      - run: bun test features/auth/googleCallback.test.ts features/attendance/infer.test.ts features/calendar/calendarEvents.test.ts features/calendar/calendarSync.integration.test.ts helpers/uuid.test.ts
      - run: bun run build
        env:
          ALLOW_MISSING_ENV: "1"
          ONE_SERVER_URL: https://attend.example.invalid
          BETTER_AUTH_URL: https://attend.example.invalid
      - uses: actions/upload-artifact@v4
        with:
          name: attend-build
          path: dist/
