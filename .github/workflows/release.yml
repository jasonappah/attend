name: Build & Release

# Deploys Cloudflare infra first, then builds + signs the release APK,
# publishes an OTA update to R2, tags, and creates a GitHub Release.
# Runs on every push to main.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write # create tags + releases

env:
  # 4-core / 16GB runner: cap heap at 12G, disable daemon, limit workers
  GRADLE_OPTS: -Dorg.gradle.jvmargs="-Xmx12g -XX:MaxMetaspaceSize=2g" -Dorg.gradle.daemon=false -Dorg.gradle.max-workers=4
  # Samsung Galaxy A13 uses arm64-v8a only
  reactNativeArchitectures: arm64-v8a

jobs:
  build-release:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history so we can derive semver from tags

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Restore Bun cache
        uses: actions/cache/restore@v4
        with:
          path: |
            node_modules
            ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lockb') }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Save Bun cache
        uses: actions/cache/save@v4
        with:
          path: |
            node_modules
            ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lockb') }}

      # --- automatic semver: bump patch from the latest git tag ----------
      - name: Determine semver
        uses: ./.github/actions/bump-version
        id: version

      # --- step 1: deploy Cloudflare infra first -------------------------
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 17

      - name: Accept Android SDK licenses
        run: |
          yes | "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true

      - name: Build (Cloudflare)
        run: bun run build
        env:
          ALLOW_MISSING_ENV: "1"
          ONE_SERVER_URL: https://attend.example.invalid
          BETTER_AUTH_URL: https://attend.example.invalid

      - name: Deploy worker and sync to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ONE_SERVER_URL: ${{ secrets.ONE_SERVER_URL }}
          ATTEND_CF_WORKER_NAME: ${{ secrets.ATTEND_CF_WORKER_NAME }}
          ATTEND_CF_BUCKET_NAME: ${{ secrets.ATTEND_CF_BUCKET_NAME }}
          ATTEND_CF_FILES_URL: ${{ secrets.ATTEND_CF_FILES_URL }}
        run: bun scripts/deploy-cloudflare.ts

      # --- step 2: build signed release APK ------------------------------
      - name: Install ccache
        run: sudo apt-get update -y && sudo apt-get install -y ccache

      - name: Restore Gradle cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.gradle/caches
            android/.gradle
          key: ${{ runner.os }}-gradle-${{ hashFiles('android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Decode release keystore
        run: |
          echo "${{ secrets.ANDROID_RELEASE_KEYSTORE_B64 }}" | base64 -d > /tmp/attend-release.keystore
          echo "ANDROID_RELEASE_STORE_FILE=/tmp/attend-release.keystore" >> "$GITHUB_ENV"

      - name: Build release APK
        env:
          ANDROID_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
          ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
          CCACHE_DIR: /tmp/ccache
        run: |
          cd android
          ./gradlew assembleRelease \
            -PreactNativeArchitectures=${{ env.reactNativeArchitectures }} \
            --no-daemon

      - name: Save Gradle cache
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.gradle/caches
            android/.gradle
          key: ${{ runner.os }}-gradle-${{ hashFiles('android/gradle/wrapper/gradle-wrapper.properties') }}

      # --- step 3: publish OTA update to R2 via wrangler -----------------
      - name: Publish OTA update
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_R2_BUCKET: ${{ secrets.CLOUDFLARE_R2_BUCKET }}
        run: |
          # Publish OTA bundle (bundles JS + assets for the release binary)
          rm -rf ./ota-android && mkdir -p ./ota-android
          bunx one updates publish --platform android --out ./ota-android

          # Upload manifest to R2 via wrangler (no awscli needed)
          wrangler r2 object put "${CLOUDFLARE_R2_BUCKET}/updates/android/${{ steps.version.outputs.version }}/manifest.json" \
            --file "./ota-android/manifest.json"

          # Upload each asset
          for f in ./ota-android/assets/*; do
            [ -f "$f" ] && wrangler r2 object put "${CLOUDFLARE_R2_BUCKET}/updates/android/${{ steps.version.outputs.version }}/assets/$(basename "$f")" --file "$f"
          done

          echo "OTA update published for android runtimeVersion=${{ steps.version.outputs.version }}"

      # --- tag + create GitHub Release -----------------------------------
      - name: Create git tag and push
        run: |
          git config user.name "Attend CI"
          git config user.email "ci@attend.local"
          git tag ${{ steps.version.outputs.tag }}
          git push origin ${{ steps.version.outputs.tag }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Attend ${{ steps.version.outputs.version }}
          body: |
            Auto-released from main.

            Version: ${{ steps.version.outputs.version }}
            Build: ${{ steps.version.outputs.versionCode }}

            Install the APK below on your Android device. Existing users also
            receive this as an OTA update (same runtimeVersion) on next launch.
          files: android/app/build/outputs/apk/release/app-release.apk
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
