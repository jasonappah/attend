name: Deploy production

on:
  push:
    branches: [main]

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Build (Cloudflare)
        run: bun run build

      - name: Deploy worker and sync to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ONE_SERVER_URL: ${{ secrets.ONE_SERVER_URL }}
          ATTEND_CF_WORKER_NAME: ${{ secrets.ATTEND_CF_WORKER_NAME }}
          ATTEND_CF_BUCKET_NAME: ${{ secrets.ATTEND_CF_BUCKET_NAME }}
          ATTEND_CF_FILES_URL: ${{ secrets.ATTEND_CF_FILES_URL }}
        run: bun scripts/deploy-cloudflare.ts
