services:
  postgres:
    image: postgres:16.2-alpine
    shm_size: 1g
    user: postgres
    restart: always
    healthcheck:
      test: 'pg_isready -U user --dbname=postgres'
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - 1917:5432
    environment:
      POSTGRES_USER: user
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD: password
    command: |
      postgres 
      -c wal_level=logical
      -c max_wal_senders=10 
      -c max_replication_slots=5 
      -c hot_standby=on 
      -c hot_standby_feedback=on
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./src/postgres/seed.sql:/docker-entrypoint-initdb.d/seed.sql

  zero-cache-dev:
    image: node:22.12.0-alpine
    network_mode: host
    depends_on:
      db-migrator-dev:
        condition: service_completed_successfully
    volumes:
      - .:/app
      - zero-cache-node-modules:/app/node_modules
    working_dir: /app
    command: sh -c "corepack enable && yarn --immutable && yarn run zero:dev"

  db-migrator-dev:
    image: node:22.12.0-alpine
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - .:/app
      - zero-cache-node-modules:/app/node_modules
    working_dir: /app
    command: sh -c "if [ ! -f scratch.disable_auto_migration ]; then corepack enable && yarn --immutable && yarn run migrate:run; fi"

  drizzle-gateway:
    image: ghcr.io/drizzle-team/gateway:latest
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "4983:4983"
    environment:
      - STORE_PATH=/app
    volumes:
      - drizzle-gateway-data:/app

volumes:
  pgdata:
    driver: local
  zero-cache-node-modules:
    driver: local
  drizzle-gateway-data:
    driver: local
